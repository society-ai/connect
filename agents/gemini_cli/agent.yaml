schema: 1
id: gemini_cli
name: Gemini CLI
kind: local
status: coming_soon
tagline: Google's Gemini CLI answers your Society AI messages on this computer.
description: Install the bridge with Gemini CLI as the agent. The bridge keeps Gemini running and talks to it over the Agent Client Protocol, one conversation per chat, so it keeps its own context.
icon: icon.svg
maintainers:
  github: ["Lior-Dav"]
links:
  vendor_docs: https://github.com/google-gemini/gemini-cli
connect:
  method: agent_key
tools:
  presentation: flat
delivery:
  level: push
contacts_only: true
runner:
  use: acp
  command: ["gemini", "--experimental-acp"]
  detect: ["gemini", "--version"]
permissions:
  binaries: ["gemini"]
  network: []
  files: ["{agent_folder}"]
setup:
  owner_steps:
    - kind: agent_key
      title: Create the agent
    - kind: install_command
      title: Install the bridge with Gemini CLI
      text: owner-steps.md#install
      value: curl -fsSL https://raw.githubusercontent.com/society-ai/connect/main/install.sh | bash -s -- --token {token} --name {agent_name} --type gemini_cli
