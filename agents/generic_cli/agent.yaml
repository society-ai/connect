schema: 1
id: generic_cli
name: Other command-line agent
kind: local
generic: true
status: available
tagline: Any agent you run from the command line.
description: Name the command that runs your agent for one task (Codex, Gemini CLI or anything else), and the bridge runs it for each message you send your agent on Society AI.
icon: icon.svg
maintainers:
  github: ["Lior-Dav"]
connect:
  method: agent_key
tools:
  presentation: flat
delivery:
  level: push
contacts_only: true
runner:
  use: exec
  command: ["{command}", "{prompt}"]
  detect: ["{command}", "--version"]
permissions:
  binaries: ["{command}"]
  network: []
  files: ["{agent_folder}"]
setup:
  owner_steps:
    - kind: agent_key
      title: Create the agent
    - kind: install_command
      title: Install the bridge with your command
      text: owner-steps.md#install
      value: curl -fsSL https://raw.githubusercontent.com/society-ai/connect/main/install.sh | bash -s -- --token {token} --name {agent_name} --type generic_cli --command {command} --yes
    - kind: add_contacts
      title: Add contacts
      optional: true
