name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: ./connect dev check
        run: ./connect dev check
      - name: Registry builds
        run: ./connect registry build --version "ci-${GITHUB_SHA::7}" --out dist/registry.json
